name: Release

# Triggered by a `v*` tag. Produces, for each of the two applications, an APK (direct install,
# sideload) and an AAB (the format the Play Store asks for), signed with the release key, then
# attaches the four files to a GitHub release along with their digests.
#
# Signing is mandatory here and there is no fallback: if the secrets are missing, the job fails
# instead of publishing debug-signed artefacts. A debug APK distributed as a release installs,
# runs, and then becomes impossible to upgrade, since its signature will never match the real one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The `versionCode` is derived from the tag and not from a counter: `v1.2.3` gives 10203,
      # which is monotonic as long as the components stay below 100 and reads back at a glance in a
      # defect report. Without this step, both applications carried `versionCode = 1` at every
      # publication — so an artefact impossible to install over the previous one, and an "About"
      # screen that announced the same version for all of them.
      #
      # **Placed right after the checkout, and not further down.** It is pure bash, with no
      # dependency: it only reads the tag name, costs nothing, and can fail — a `v1.100.0` tag
      # exits 1 on the guard for components < 100. Placed after the full test suite and lint, that
      # refusal arrived some twenty minutes in; it now arrives in the first second. General rule of
      # this file: whatever can refuse must refuse early. Its outputs are only consumed by the
      # "Build signed artifacts" step, much further down.
      - name: Derive the version from the tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VERSION="${VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::minor and patch must stay below 100 for versionCode to remain monotonic."
            exit 1
          fi
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE"     >> "$GITHUB_OUTPUT"
          echo "version $VERSION -> versionCode $CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify the release secrets are present
        env:
          KEYSTORE: ${{ secrets.PENDULUM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::PENDULUM_KEYSTORE_BASE64 is not set."
            echo "A release cannot be signed without it, and an unsigned or debug-signed"
            echo "artifact must never be published as a release — it would install, run, and"
            echo "then be impossible to upgrade. See docs/09-release.md."
            exit 1
          fi

      - name: Materialise the keystore
        env:
          KEYSTORE: ${{ secrets.PENDULUM_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > release.keystore
          echo "keystore: $(wc -c < release.keystore) bytes"

      # What used to run here: `:format:test :algo:test || true`, and nothing else. The pipeline
      # that holds the signing key was therefore **more permissive than ordinary CI** — the 624
      # tests of the two applications did not run before producing the published AAB, so that a
      # regression blocked on a pull request could ship to production through a tag.
      #
      # Three cumulative defects, all fixed here:
      #  - the Android modules' tests were not launched;
      #  - `|| true` with no counting guard: a compilation error produces **no** XML report at all,
      #    the failure list comes out empty, and the absence of a result read as a success;
      #  - an exception named `T6` was hard-coded, while `ci.yml` has documented for a long time
      #    that no test is tolerated red any more. Of the two files, it was the more permissive one
      #    that guarded the keystore.
      #
      # `:sleepwriter:testSourceADebugUnitTest` and not `:sleepwriter:test`: `test` is an aggregate
      # over the four variants (two flavours x two build types) while the 16 tests live in the
      # shared `src/test/` and none of them tells the flavours apart. Same choice as `ci.yml`.
      - name: Run every test before shipping anything
        continue-on-error: true
        run: |
          ./gradlew --console=plain --continue \
            :format:test :algo:test :sleepwriter:testSourceADebugUnitTest \
            :wear:testDebugUnitTest :phone:testDebugUnitTest

      # The release variants, apart, and filtered on what they alone bring: the guard rail that
      # refuses to let a bench build — time compressed by a factor of 300 — ship to production.
      # Without a filter, `testReleaseUnitTest` additionally replays the whole of `src/test/`, some
      # ~320 tests that were green in debug a few seconds earlier, to gain 6. A separate step
      # because a `--tests` applies to every test task of the invocation and Gradle fails if one of
      # them has no match; both modules do have their file, so grouping them together is safe.
      #
      # Two patterns because the modules name their guard rail differently — `ReleaseScaleTest` on
      # the watch, `ReleaseTimeScalingTest` on the phone. Same reasoning as `ci.yml`.
      - name: Run the release-variant guard-rail tests
        continue-on-error: true
        run: |
          ./gradlew --console=plain --continue \
            :wear:testReleaseUnitTest :phone:testReleaseUnitTest \
            --tests '*ReleaseScaleTest' --tests '*ReleaseTimeScalingTest'

      # The guard that was missing, now shared word for word with `ci.yml`: it is the file
      # `tools/ci/verifier-tests.py` that decides, and not Gradle's exit code. Zero reports does
      # not mean zero failures there, it means "nothing ran" — the case where publishing would be
      # the most serious, and the one that had let an untested release out. Three divergent copies
      # of this check meant three occasions to fix it in a single place.
      - name: Refuse to release unless every test passed
        run: python3 tools/ci/verifier-tests.py

      # Lint too, before signing: `lintVitalRelease`, which `bundleRelease` triggers, only plays
      # the FATAL rules, and therefore let errors of ERROR severity through.
      - name: Lint before shipping
        run: ./gradlew :wear:lintDebug :phone:lintDebug --console=plain --continue

      - name: Build signed artifacts
        env:
          PENDULUM_KEYSTORE_PASSWORD: ${{ secrets.PENDULUM_KEYSTORE_PASSWORD }}
          PENDULUM_KEY_ALIAS: ${{ secrets.PENDULUM_KEY_ALIAS }}
          PENDULUM_KEY_PASSWORD: ${{ secrets.PENDULUM_KEY_PASSWORD }}
        run: |
          ./gradlew :phone:assembleRelease :phone:bundleRelease \
                    :wear:assembleRelease  :wear:bundleRelease --console=plain \
                    -Ppendulum.versionName=${{ steps.version.outputs.name }} \
                    -Ppendulum.versionCode=${{ steps.version.outputs.code }}

      - name: Collect and name the artifacts
        id: collect
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VERSION="${VERSION#v}"
          mkdir -p artifacts
          cp phone/build/outputs/apk/release/phone-release.apk      "artifacts/pendulum-phone-${VERSION}.apk"
          cp phone/build/outputs/bundle/release/phone-release.aab   "artifacts/pendulum-phone-${VERSION}.aab"
          cp wear/build/outputs/apk/release/wear-release.apk        "artifacts/pendulum-watch-${VERSION}.apk"
          cp wear/build/outputs/bundle/release/wear-release.aab     "artifacts/pendulum-watch-${VERSION}.aab"
          cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f release.keystore

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Pendulum ${{ steps.collect.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            **Pendulum** estimates periodic limb movements in sleep from a smartwatch worn at the
            ankle. It tracks the *rhythm* between movements rather than their number, because the
            rhythm is the stable quantity.

            > **Not a medical device, not an official health application, and it diagnoses
            > nothing.** It has never been validated against polysomnography. No treatment
            > decision should be taken on the basis of a number it produces.

            ### What is in this release

            | File | Install on |
            |---|---|
            | `pendulum-phone-*.apk` | An Android phone, by sideloading |
            | `pendulum-watch-*.apk` | A Wear OS watch, worn at the ankle |
            | `*.aab` | Not installable directly — the format the Play Store consumes |

            `SHA256SUMS.txt` covers all four. Verify with `sha256sum -c SHA256SUMS.txt`.

            ### Before installing

            You need **two** devices: a Wear OS watch for the ankle, and a separate source of
            sleep timing that writes to Health Connect. One sensor cannot honestly measure both
            the movements and the sleep they happen in — see
            [`docs/05-devices.md`](docs/05-devices.md).

            Installation and first-run walkthrough: [`docs/09-release.md`](docs/09-release.md).
