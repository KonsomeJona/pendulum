name: Release

# Déclenché par un tag `v*`. Produit, pour chacune des deux applications, un APK (installation
# directe, sideload) et un AAB (le format que le Play Store demande), signés avec la clé de
# publication, puis attache les quatre fichiers à une release GitHub avec leurs empreintes.
#
# La signature est obligatoire ici et il n'y a pas de repli : si les secrets manquent, le job
# échoue au lieu de publier des artefacts signés en debug. Un APK debug distribué comme une
# release s'installe, tourne, et devient impossible à mettre à jour par la suite puisque sa
# signature ne correspondra jamais à la vraie.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Le `versionCode` est derive du tag et non d'un compteur : `v1.2.3` donne 10203, ce qui est
      # monotone tant que les composants restent sous 100 et se relit a l'oeil dans un rapport de
      # defaut. Sans cette etape, les deux applications portaient `versionCode = 1` a chaque
      # publication — donc un artefact impossible a installer par-dessus le precedent, et un ecran
      # « A propos » qui annoncait la meme version pour toutes.
      #
      # **Placée juste après le checkout, et pas plus bas.** C'est du bash pur, sans dépendance :
      # elle ne lit que le nom du tag, ne coûte rien, et peut échouer — un tag `v1.100.0` sort en
      # `exit 1` sur la garde des composants < 100. Placée après la suite de tests complète et
      # lint, ce refus arrivait au bout d'une vingtaine de minutes ; il arrive maintenant à la
      # première seconde. Règle générale de ce fichier : ce qui peut refuser doit refuser tôt.
      # Ses sorties ne sont consommées qu'à l'étape « Build signed artifacts », bien plus bas.
      - name: Derive the version from the tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VERSION="${VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::minor and patch must stay below 100 for versionCode to remain monotonic."
            exit 1
          fi
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE"     >> "$GITHUB_OUTPUT"
          echo "version $VERSION -> versionCode $CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify the release secrets are present
        env:
          KEYSTORE: ${{ secrets.PENDULUM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::PENDULUM_KEYSTORE_BASE64 is not set."
            echo "A release cannot be signed without it, and an unsigned or debug-signed"
            echo "artifact must never be published as a release — it would install, run, and"
            echo "then be impossible to upgrade. See docs/09-release.md."
            exit 1
          fi

      - name: Materialise the keystore
        env:
          KEYSTORE: ${{ secrets.PENDULUM_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > release.keystore
          echo "keystore: $(wc -c < release.keystore) bytes"

      # Ce qui tournait ici : `:format:test :algo:test || true`, et rien d'autre. Le pipeline qui
      # détient la clé de signature était donc **plus permissif que la CI ordinaire** — les 624 tests
      # des deux applications ne s'exécutaient pas avant de produire l'AAB publié, si bien qu'une
      # régression bloquée sur une pull request pouvait partir en production par un tag.
      #
      # Trois défauts cumulés, tous corrigés ici :
      #  - les tests des modules Android n'étaient pas lancés ;
      #  - `|| true` sans garde de comptage : une erreur de compilation ne produit **aucun** rapport
      #    XML, la liste d'échecs sort vide, et l'absence de résultat se lisait comme un succès ;
      #  - une exception nommée `T6` était codée en dur, alors que `ci.yml` documente depuis
      #    longtemps qu'aucun test n'est plus toléré rouge. Des deux fichiers, c'était le plus
      #    permissif qui gardait le keystore.
      #
      # `:sleepwriter:testSourceADebugUnitTest` et non `:sleepwriter:test` : `test` est un agrégat
      # sur les quatre variantes (deux saveurs × deux types de build) alors que les 16 tests vivent
      # dans le `src/test/` partagé et qu'aucun ne distingue les saveurs. Même choix que `ci.yml`.
      - name: Run every test before shipping anything
        continue-on-error: true
        run: |
          ./gradlew --console=plain --continue \
            :format:test :algo:test :sleepwriter:testSourceADebugUnitTest \
            :wear:testDebugUnitTest :phone:testDebugUnitTest

      # Les variantes release, à part, et filtrées sur ce qu'elles seules apportent :
      # `EchelleReleaseTest`, le garde-fou qui refuse qu'une compilation de banc — temps comprimé
      # d'un facteur 300 — parte en production. Sans filtre, `testReleaseUnitTest` rejoue en plus
      # tout `src/test/`, soit ~320 tests déjà verts en debug quelques secondes plus tôt, pour en
      # gagner 6. Étape séparée parce qu'un `--tests` s'applique à toutes les tâches de test de
      # l'invocation et que Gradle échoue si l'une d'elles n'a aucune correspondance ; les deux
      # modules ont bien ce fichier, donc les grouper entre eux est sûr.
      - name: Run the release-variant guard-rail tests
        continue-on-error: true
        run: |
          ./gradlew --console=plain --continue \
            :wear:testReleaseUnitTest :phone:testReleaseUnitTest \
            --tests '*EchelleReleaseTest'

      # La garde qui manquait, désormais partagée mot pour mot avec `ci.yml` : c'est le fichier
      # `tools/ci/verifier-tests.py` qui décide, et non le code de retour de Gradle. Zéro rapport
      # n'y veut pas dire zéro échec, mais « rien n'a tourné » — le cas où publier serait le plus
      # grave, et celui qui avait laissé sortir une release non testée. Trois copies divergentes
      # de ce contrôle, c'était trois occasions de le corriger à un seul endroit.
      - name: Refuse to release unless every test passed
        run: python3 tools/ci/verifier-tests.py

      # Lint aussi, avant signature : `lintVitalRelease` que `bundleRelease` déclenche ne joue que
      # les règles FATAL, et laissait donc passer les erreurs de sévérité ERROR.
      - name: Lint before shipping
        run: ./gradlew :wear:lintDebug :phone:lintDebug --console=plain --continue

      - name: Build signed artifacts
        env:
          PENDULUM_KEYSTORE_PASSWORD: ${{ secrets.PENDULUM_KEYSTORE_PASSWORD }}
          PENDULUM_KEY_ALIAS: ${{ secrets.PENDULUM_KEY_ALIAS }}
          PENDULUM_KEY_PASSWORD: ${{ secrets.PENDULUM_KEY_PASSWORD }}
        run: |
          ./gradlew :phone:assembleRelease :phone:bundleRelease \
                    :wear:assembleRelease  :wear:bundleRelease --console=plain \
                    -Ppendulum.versionName=${{ steps.version.outputs.name }} \
                    -Ppendulum.versionCode=${{ steps.version.outputs.code }}

      - name: Collect and name the artifacts
        id: collect
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VERSION="${VERSION#v}"
          mkdir -p artifacts
          cp phone/build/outputs/apk/release/phone-release.apk      "artifacts/pendulum-phone-${VERSION}.apk"
          cp phone/build/outputs/bundle/release/phone-release.aab   "artifacts/pendulum-phone-${VERSION}.aab"
          cp wear/build/outputs/apk/release/wear-release.apk        "artifacts/pendulum-watch-${VERSION}.apk"
          cp wear/build/outputs/bundle/release/wear-release.aab     "artifacts/pendulum-watch-${VERSION}.aab"
          cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f release.keystore

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Pendulum ${{ steps.collect.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            **Pendulum** estimates periodic limb movements in sleep from a smartwatch worn at the
            ankle. It tracks the *rhythm* between movements rather than their number, because the
            rhythm is the stable quantity.

            > **Not a medical device, not an official health application, and it diagnoses
            > nothing.** It has never been validated against polysomnography. No treatment
            > decision should be taken on the basis of a number it produces.

            ### What is in this release

            | File | Install on |
            |---|---|
            | `pendulum-phone-*.apk` | An Android phone, by sideloading |
            | `pendulum-watch-*.apk` | A Wear OS watch, worn at the ankle |
            | `*.aab` | Not installable directly — the format the Play Store consumes |

            `SHA256SUMS.txt` covers all four. Verify with `sha256sum -c SHA256SUMS.txt`.

            ### Before installing

            You need **two** devices: a Wear OS watch for the ankle, and a separate source of
            sleep timing that writes to Health Connect. One sensor cannot honestly measure both
            the movements and the sleep they happen in — see
            [`docs/05-devices.md`](docs/05-devices.md).

            Installation and first-run walkthrough: [`docs/09-release.md`](docs/09-release.md).
