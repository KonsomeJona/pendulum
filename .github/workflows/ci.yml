name: CI

# What runs on every push, in order of increasing cost: the JVM tests first, because they carry the
# algorithm and they are fast; the Android assembly next; the instrumented tests last, because they
# boot an emulator.
#
# A point of method: the project tolerated one failure **by name** for a long time, T6, through a
# step that read the XML reports and checked that nothing else was red. That exception no longer
# exists — T6 passes since its denominator was redefined and since the under-count it excluded
# became a published, monitored quantity, T22 (docs/07-validation.md §4.1). **No test is tolerated
# red any more.**
#
# What remains of that step, and what was never the exception, is the guard that fails when Gradle
# has produced **no** report at all: that is the case of a compilation error, which reading the XML
# reports alone would let through as a silent success.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM tests (format, algo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # `continue-on-error` rather than a `|| true`: the step stays visibly red in the interface,
      # but the job carries on to the check that follows, which is the one that decides. A
      # `|| true` would hide a compilation error just as well as a red test.
      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :format:test :algo:test --console=plain --continue

      # This is the step that decides, and not Gradle's exit code. It fails if a test is red, and
      # also — which matters just as much — if Gradle failed without producing a report, the case
      # where a naive `|| true` would have let a compilation error through as a success.
      #
      # The glob is **restricted** here: `:format` and `:algo` are pure Kotlin modules, their task
      # is called `test` and their reports come out in `build/test-results/test/`. Naming it
      # explicitly makes this job a guard over its own scope: if `:format:test` stops running, this
      # job says so, instead of counting another job's reports.
      - name: Check the tests ran, and that all of them passed
        run: python3 tools/ci/verifier-tests.py '*/build/test-results/test/*.xml'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/test'
          retention-days: 14

  android-build:
    name: Assemble both applications and run their unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :wear:assembleDebug :phone:assembleDebug --console=plain

      # The JVM tests of the two **Android** modules, which ran in no pipeline at all.
      #
      # The job next door only launches `:format:test` and `:algo:test`: those are pure Kotlin
      # modules, whose task is called `test` and whose reports come out in
      # `build/test-results/test/`. An Android module has no `test` task — it has
      # `testDebugUnitTest`, and its reports come out in `test-results/testDebugUnitTest/`. The
      # verification glob therefore never saw them, and the omission was invisible from both
      # sides: nothing failed, and the displayed total stayed correct for the modules it did
      # count. More than two hundred tests were running nowhere.
      #
      # Same mechanism as the JVM job: `continue-on-error` so the step stays red to the eye
      # without stopping the job, and a check that decides from the reports.
      #
      # `:sleepwriter` is added because its 16 tests were launched nowhere. It is a bench tool that
      # is never published, but it shares `:format` with the product.
      #
      # `testSourceADebugUnitTest` and not `test`: `test` is an aggregate that depends on **all**
      # the variants — two flavours x two build types — that is four compilations and 64 runs for
      # 16 tests that all live in the shared `src/test/`. The two flavours differ only by an
      # `applicationIdSuffix` and two strings; no test tells them apart. This is exactly the
      # reasoning already applied to lint further down (`lintSourceADebug`).
      - name: Run Android unit tests
        id: android-tests
        continue-on-error: true
        run: |
          ./gradlew --console=plain --continue \
            :wear:testDebugUnitTest :phone:testDebugUnitTest \
            :sleepwriter:testSourceADebugUnitTest

      # The **release** variants carry the guard rail that makes sure no bench build — the one
      # where time is compressed by a factor of 300 — ever ships to production. It ran in no
      # pipeline: it lives in the `testRelease` source set, which `testDebugUnitTest` does not
      # touch. The only test that protects against "the night expires after two minutes on the
      # user's device" never ran at all.
      #
      # A separate step, and a filtered one, for two reasons:
      #  - `testReleaseUnitTest` does not only compile `src/testRelease/`, it also replays the
      #    whole of `src/test/` — some ~320 tests that were green in debug a few seconds earlier —
      #    to gain 6. The filter keeps only what the release variant actually brings.
      #  - a `--tests` filter applies to **every** test task of the invocation, and Gradle fails if
      #    one of them finds no match. It therefore cannot cohabit with the debug invocation above.
      #    Grouped here because `:wear` **and** `:phone` do each have their release-variant guard
      #    rail: if either loses its file, it is not the filter that should be relaxed, it is the
      #    guard rail that should be put back.
      #
      # Two patterns and not one, because the two modules name their guard rail differently —
      # `ReleaseScaleTest` on the watch, `ReleaseTimeScalingTest` on the phone. A `--tests` filter
      # is a union across the patterns, so each task still matches at least one and neither is
      # silently skipped.
      - name: Run the release-variant guard-rail tests
        continue-on-error: true
        run: |
          ./gradlew --console=plain --continue \
            :wear:testReleaseUnitTest :phone:testReleaseUnitTest \
            --tests '*ReleaseScaleTest' --tests '*ReleaseTimeScalingTest'

      # Default glob: **all** the task variants — `testDebugUnitTest`, `testReleaseUnitTest`,
      # flavour variants. A glob naming a single variant is exactly what left more than two hundred
      # tests out of CI without anything saying so.
      - name: Check the Android tests ran, and that all of them passed
        run: python3 tools/ci/verifier-tests.py

      # Lint ran in **no** pipeline. `lintVitalRelease`, which `bundleRelease` triggers, only plays
      # the rules of FATAL severity: the one real lint error this project ever had — a notification
      # call that lint believed unguarded — is of ERROR severity, and it therefore lived in the
      # tree without anything being able to say so.
      #
      # `lintDebug` and not `lint`: the `lint` task plays every variant, which doubles the time
      # without teaching anything more here. `--continue` to see the three modules at once rather
      # than stopping at the first, which had left `:phone` unlinted while `:wear` was blocking the
      # chain.
      - name: Lint the three Android modules
        run: ./gradlew :wear:lintDebug :phone:lintDebug :sleepwriter:lintSourceADebug --console=plain --continue

      # The two APKs the run was actually built from.
      #
      # They were assembled and thrown away: to try a branch on a device, you had to build it
      # yourself, which is exactly the step that makes a report like "it does not do that on my
      # phone" impossible to settle. `always()` on purpose — a build whose tests failed is often
      # the one you most want to install and reproduce.
      #
      # These are debug-signed, so they will not install over a release build without an uninstall
      # first. That is Android refusing to swap a signing key under an application, not a defect.
      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            phone/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '*/build/reports/lint-results-*.html'
          retention-days: 14

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: '*/build/reports/tests/*'
          retention-days: 14

      # 7 days and not 14: these APKs weigh ~21 MB per run and only serve to try a branch out
      # before merging. The artefacts that matter — the ones people install — are attached to a
      # **release**, and those never expire. Confusing the two is the simplest way to fill the
      # storage quota with files nobody will reopen.
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: '*/build/outputs/apk/debug/*.apk'
          retention-days: 7

  instrumented-tests:
    name: Guard-rail tests on an emulator
    runs-on: ubuntu-latest
    # These tests check what no JVM test can reach: that the assembled interface really does refuse
    # to aggregate below three nights, that the warning still says this is not an official health
    # application, and that the hierarchy of quantities holds.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :phone:connectedDebugAndroidTest --console=plain

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: phone/build/reports/androidTests
          retention-days: 14

  wear-instrumented-tests:
    name: Component permissions on a watch emulator
    runs-on: ubuntu-latest
    # **Not on pull requests.** This job boots a Wear OS emulator — 10 to 15 minutes — to run *one*
    # test method. What it observes, a manifest `android:permission`, only changes through a manual
    # edit of the manifest; there is no path by which a Kotlin code change makes it appear. Paying
    # that cost on every push to every branch amounts to re-checking, dozens of times a day, a file
    # nobody has touched — and it is the most unstable job in this file, so the one whose failure
    # ends up being ignored, which is worth less than no test at all.
    #
    # It stays **automated**, and it stays blocking: on `push` to `main` — so on every merge,
    # before a tag can be laid down — and on demand. The window left open is that of a pull request
    # that would break the manifest and be merged before the job says so: it is closed at the
    # merge, before publication. Do not put `pull_request` back by reflex without first having a
    # real defect that a pull request would have introduced.
    if: github.event_name != 'pull_request'
    # `ComponentPermissionsTest` on the watch side checks that no component requires a permission
    # that no package defines. This is not an abstract precaution: both `WearableListenerService`
    # carried such a permission, Android refused to let Play Services start them, and **the whole
    # of ingestion was dead** — no exception, no message, with a single `Permission Denial` line in
    # the system log as its only trace.
    #
    # The test existed and its own KDoc said it "is run by hand on a real watch, for want of a
    # watch emulator in CI". This is that job. To watch out for: Wear OS images are slower to boot
    # than phone images, and this is the job most likely to be unstable in the whole file.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run watch instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          disable-animations: true
          script: ./gradlew :wear:connectedDebugAndroidTest --console=plain

      - name: Upload watch instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-instrumented-reports
          path: wear/build/reports/androidTests
          retention-days: 14
