<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" width="600" height="540" role="img" aria-label="Drawing only, no text. Top: front view of a lower leg with a watch drawn on the front of the shin above the ankle bones, and the two ankle bones marked with crossed-out watch outlines. Bottom: the same watch drawn three times side by side, its button in a different position each time, with a curved arrow, showing that the case may be turned in its own plane.">
<style>
  .limb{fill:none;stroke:#94a3b8;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
  .bone{fill:none;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 3}
  .watch{fill:none;stroke:#0f172a;stroke-width:2.4}
  .ghost{fill:none;stroke:#b91c1c;stroke-width:1.8;stroke-dasharray:4 3}
  .cross{stroke:#b91c1c;stroke-width:2.2;stroke-linecap:round}
  .rot{fill:none;stroke:#2563eb;stroke-width:1.6}
  .sep{stroke:#e2e8f0;stroke-width:1}
  @media (prefers-color-scheme:dark){
    .limb{stroke:#64748b} .bone{stroke:#334155}
    .watch{stroke:#e2e8f0} .ghost,.cross{stroke:#f87171}
    .rot{stroke:#60a5fa} .sep{stroke:#1e293b}
  }
</style>
<defs>
  <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
  </marker>
</defs>

<!-- ===================================================================================
     Le dessin seul. Aucun texte : les libelles vivent dans `res/values/strings.xml` et
     sont poses par l'ecran qui affiche cette image, ce qui les rend traduisibles. Un
     `<text>` dans un SVG ne l'est pas — il faudrait un fichier par langue.

     Ce que le dessin doit dire tout seul, sans legende :
       - la montre va DEVANT le tibia, au-dessus des bosses de la cheville ;
       - elle ne va PAS sur les bosses (contours barres) ;
       - son orientation est libre (trois fois la meme montre, bouton deplace).
     =================================================================================== -->

<!--  Vue de face : ou porter  -->
<path class="limb" d="M232 40 Q224 140 228 206"/>
<path class="limb" d="M312 40 Q320 140 316 206"/>
<!-- les deux malleoles, les bosses qu'on sent au doigt -->
<path class="limb" d="M228 206 Q220 226 224 242 Q230 252 240 248"/>
<path class="limb" d="M316 206 Q324 226 320 242 Q314 252 304 248"/>
<!-- le cou-de-pied et les orteils, vus de face -->
<path class="limb" d="M240 248 Q236 272 234 290 Q232 310 252 314 L292 314 Q312 310 310 290 Q308 272 304 248"/>
<path class="limb" d="M236 294 Q272 302 308 294"/>
<!-- le tibia : l'os qu'on longe -->
<path class="bone" d="M272 48 L272 236"/>

<!-- la montre a sa place : devant, nettement au-dessus des bosses -->
<rect class="watch" x="245" y="146" width="54" height="36" rx="8"/>
<circle class="watch" cx="272" cy="164" r="5"/>
<path class="watch" d="M245 157 q-15 7 0 14"/>
<path class="watch" d="M299 157 q15 7 0 14"/>

<!-- ce qu'il ne faut pas faire : la montre sur les bosses elles-memes -->
<g>
  <rect class="ghost" x="200" y="210" width="46" height="30" rx="6"/>
  <path class="cross" d="M209 218 L237 232 M237 218 L209 232"/>
</g>
<g>
  <rect class="ghost" x="298" y="210" width="46" height="30" rx="6"/>
  <path class="cross" d="M307 218 L335 232 M335 218 L307 232"/>
</g>

<!--  Separateur  -->
<line x1="80" y1="368" x2="520" y2="368" class="sep"/>

<!--  La meme montre, tournee sur elle-meme : trois fois, bouton deplace  -->
<g>
  <rect class="watch" x="120" y="440" width="60" height="40" rx="9"/>
  <circle class="watch" cx="183" cy="460" r="4.5"/>
</g>
<g opacity="0.55">
  <rect class="watch" x="270" y="440" width="60" height="40" rx="9"/>
  <circle class="watch" cx="300" cy="436" r="4.5"/>
</g>
<g opacity="0.55">
  <rect class="watch" x="420" y="440" width="60" height="40" rx="9"/>
  <circle class="watch" cx="417" cy="460" r="4.5"/>
</g>

<path class="rot" d="M196 418 a132 132 0 0 1 208 0" marker-end="url(#tip)"/>
</svg>
