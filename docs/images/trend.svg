<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780" role="img" aria-labelledby="ti de">
  <title id="ti">Pendulum — écran Tendance, rythme fondamental sur huit nuits</title>
  <desc id="de">Maquette. Médiane du rythme fondamental à 21 secondes, intervalle de confiance 19 à 23 secondes sur 7 nuits éligibles. Le graphe porte la bande de plus petite variation détectable, la bande d'IC 95 %, la ligne de médiane et un point par nuit — non reliés. Une nuit écartée est tracée en cercle creux à sa valeur, avec son motif.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .t   { font-size: 21px; font-weight: 500; fill: #E6EAF0; }
    .vd  { font-size: 14.5px; font-weight: 500; fill: #E6EAF0; }
    .b   { font-size: 13.5px; fill: #A3ADBB; }
    .bp  { font-size: 13.5px; fill: #E6EAF0; }
    .c   { font-size: 11.5px; fill: #7C8695; }
    .lb  { font-size: 11px; font-weight: 500; fill: #7C8695; letter-spacing: .6px; }
    .ax  { font-size: 9.5px; fill: #7C8695; }
    .lg  { font-size: 10.5px; fill: #A3ADBB; }
    .nav { font-size: 10.5px; fill: #7C8695; }
  </style>

  <rect width="360" height="780" fill="#0E1116"/>

  <text class="c" x="16" y="16">09:41</text>
  <rect x="330" y="8" width="16" height="8" rx="2" fill="none" stroke="#7C8695"/>
  <rect x="332" y="10" width="12" height="4" fill="#7C8695"/>

  <text class="t" x="16" y="58">Tendance</text>
  <rect x="256" y="40" width="88" height="26" rx="10" fill="none" stroke="#2A313C"/>
  <text class="c" x="270" y="57" fill="#A3ADBB">14 nuits</text>
  <path d="M326 52 l4 4 l4 -4" fill="none" stroke="#7C8695" stroke-width="1.3"/>

  <!-- ============ headline card ============ -->
  <rect x="16" y="82" width="328" height="196" rx="14" fill="#161A21" stroke="#2A313C"/>

  <!-- the verdict is named before the number is given -->
  <text class="vd" x="32" y="110">Variation indiscernable de la</text>
  <text class="vd" x="32" y="129">variabilité nuit à nuit</text>

  <text x="32" y="182" font-size="44px" font-weight="300" letter-spacing="-0.5" fill="#E6EAF0"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        style="font-variant-numeric: tabular-nums;">21<tspan font-size="20px" dx="4">s</tspan></text>

  <text class="b" x="32" y="206">IC 95 % : 19 – 23 s  ·  7 nuits éligibles</text>
  <text class="c" x="32" y="226">Rythme fondamental, médiane des nuits · périodicité élevée</text>

  <line x1="32" y1="240" x2="328" y2="240" stroke="#2A313C"/>
  <text class="ax" x="32"  y="262">Compte horaire, pour le médecin</text>
  <text class="c"  x="328" y="262" text-anchor="end" fill="#A3ADBB">24 /h · IC 95 % 17 – 33</text>

  <!-- ============ trend chart ============ -->
  <rect x="16" y="290" width="328" height="258" rx="14" fill="#161A21" stroke="#2A313C"/>
  <text class="lb" x="32" y="314">RYTHME FONDAMENTAL, NUIT PAR NUIT</text>
  <rect x="272" y="300" width="56" height="22" rx="10" fill="none" stroke="#2A313C"/>
  <text class="c" x="300" y="315" text-anchor="middle" fill="#A3ADBB">Valeurs</text>
  <text class="ax" x="40" y="328">secondes</text>

  <!-- plot area 40..336 x 330..460 ; y = 460 - (v-14) * 8.125 -->
  <g>
    <!-- horizontal grid -->
    <line x1="40" y1="451.9" x2="336" y2="451.9" stroke="#2A313C" stroke-width="0.7"/>
    <line x1="40" y1="411.3" x2="336" y2="411.3" stroke="#2A313C" stroke-width="0.7"/>
    <line x1="40" y1="370.6" x2="336" y2="370.6" stroke="#2A313C" stroke-width="0.7"/>
    <line x1="40" y1="330.0" x2="336" y2="330.0" stroke="#2A313C" stroke-width="0.7"/>
    <text class="ax" x="36" y="455" text-anchor="end">15</text>
    <text class="ax" x="36" y="414" text-anchor="end">20</text>
    <text class="ax" x="36" y="374" text-anchor="end">25</text>
    <text class="ax" x="36" y="333" text-anchor="end">30</text>

    <!-- minimum detectable change, 6,4 s wide, dotted borders -->
    <rect x="40" y="373.9" width="296" height="51.2" fill="#7C8695" fill-opacity="0.07"/>
    <line x1="40" y1="373.9" x2="336" y2="373.9" stroke="#7C8695" stroke-width="1" stroke-dasharray="1.5 3"/>
    <line x1="40" y1="425.1" x2="336" y2="425.1" stroke="#7C8695" stroke-width="1" stroke-dasharray="1.5 3"/>
    <text class="ax" x="44" y="437">MDC 95 % · ±3,2 s</text>

    <!-- 95 % CI of the median, dashed borders -->
    <rect x="40" y="383.4" width="296" height="34.4" fill="#6FB2FF" fill-opacity="0.14"/>
    <line x1="40" y1="383.4" x2="336" y2="383.4" stroke="#6FB2FF" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.7"/>
    <line x1="40" y1="417.8" x2="336" y2="417.8" stroke="#6FB2FF" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.7"/>
    <text class="ax" x="46" y="415" fill="#6FB2FF">IC 95 %</text>

    <!-- median -->
    <line x1="40" y1="399.8" x2="336" y2="399.8" stroke="#6FB2FF" stroke-width="2"/>
    <text class="ax" x="332" y="394" text-anchor="end" fill="#6FB2FF">21 s</text>

    <!-- x axis, calendar: 02/03 at x=40, 14/03 at x=336 -->
    <line x1="40" y1="460" x2="336" y2="460" stroke="#2A313C"/>
    <g stroke="#2A313C">
      <line x1="64.7"  y1="460" x2="64.7"  y2="464"/>
      <line x1="89.3"  y1="460" x2="89.3"  y2="464"/>
      <line x1="114.0" y1="460" x2="114.0" y2="464"/>
      <line x1="138.7" y1="460" x2="138.7" y2="464"/>
      <line x1="163.3" y1="460" x2="163.3" y2="464"/>
      <line x1="188.0" y1="460" x2="188.0" y2="464"/>
      <line x1="212.7" y1="460" x2="212.7" y2="464"/>
      <line x1="237.3" y1="460" x2="237.3" y2="464"/>
      <line x1="262.0" y1="460" x2="262.0" y2="464"/>
      <line x1="286.7" y1="460" x2="286.7" y2="464"/>
      <line x1="311.3" y1="460" x2="311.3" y2="464"/>
    </g>
    <text class="ax" x="64.7"  y="474" text-anchor="middle">03/03</text>
    <text class="ax" x="138.7" y="474" text-anchor="middle">06/03</text>
    <text class="ax" x="212.7" y="474" text-anchor="middle">09/03</text>
    <text class="ax" x="286.7" y="474" text-anchor="middle">12/03</text>

    <!-- one point per night, deliberately not joined -->
    <circle cx="64.7"  cy="391.5" r="4.2" fill="#6FB2FF"/>
    <circle cx="89.3"  cy="412.9" r="4.2" fill="#6FB2FF"/>
    <circle cx="138.7" cy="385.8" r="4.2" fill="#6FB2FF"/>
    <circle cx="163.3" cy="406.4" r="4.2" fill="#6FB2FF"/>
    <circle cx="262.0" cy="395.7" r="4.2" fill="#6FB2FF"/>
    <circle cx="286.7" cy="421.9" r="4.2" fill="#6FB2FF"/>
    <circle cx="286.7" cy="421.9" r="6.4" fill="none" stroke="#E0A33E" stroke-width="1.6"/>
    <circle cx="311.3" cy="399.8" r="4.2" fill="#6FB2FF"/>

    <!-- excluded night: drawn at its value, counted nowhere -->
    <circle cx="212.7" cy="343.9" r="4.2" fill="none" stroke="#7C8695" stroke-width="1.6"/>
    <line x1="217" y1="345" x2="228" y2="345" stroke="#7C8695" stroke-width="0.8"/>
    <text class="ax" x="232" y="342">écartée : 2 h 10</text>
    <text class="ax" x="232" y="353">de sommeil</text>
  </g>

  <!-- legend: shape carries the meaning, not colour -->
  <circle cx="36" cy="493" r="4.2" fill="#6FB2FF"/>
  <text class="lg" x="45" y="497">éligible</text>
  <circle cx="98" cy="493" r="4.2" fill="#6FB2FF"/>
  <circle cx="98" cy="493" r="6.4" fill="none" stroke="#E0A33E" stroke-width="1.6"/>
  <text class="lg" x="108" y="497">masque accéléro</text>
  <circle cx="216" cy="493" r="4.2" fill="none" stroke="#7C8695" stroke-width="1.6"/>
  <text class="lg" x="226" y="497">écartée, hors calcul</text>

  <text class="c" x="32" y="519">Points non reliés : une nuit ne se prolonge pas dans la</text>
  <text class="c" x="32" y="534">suivante. Pas d'ancrage à zéro : un rythme n'en a pas.</text>

  <!-- ============ active rules ============ -->
  <line x1="0" y1="560" x2="360" y2="560" stroke="#2A313C"/>
  <text class="b"  x="16"  y="580">Règle de comptage</text>
  <text class="bp" x="330" y="580" text-anchor="end">AASM v3 (5–90 s)</text>
  <path d="M336 576 l4 4 l4 -4" fill="none" stroke="#7C8695" stroke-width="1.3"/>
  <line x1="0" y1="592" x2="360" y2="592" stroke="#2A313C"/>
  <text class="b"  x="16"  y="612">Masque de sommeil</text>
  <text class="bp" x="344" y="612" text-anchor="end">Health Connect (6/7)</text>
  <line x1="0" y1="624" x2="360" y2="624" stroke="#2A313C"/>
  <text class="b"  x="16"  y="644">Taux de manqués estimé</text>
  <text class="bp" x="344" y="644" text-anchor="end">p = 0,34</text>
  <line x1="0" y1="656" x2="360" y2="656" stroke="#2A313C"/>

  <rect x="16" y="666" width="328" height="42" rx="10" fill="#161A21" stroke="#6FB2FF"/>
  <text x="180" y="692" text-anchor="middle" font-size="13.5px" font-weight="500" fill="#6FB2FF"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">Préparer un rapport pour le médecin</text>

  <!-- navigation bar -->
  <line x1="0" y1="724" x2="360" y2="724" stroke="#2A313C"/>
  <rect x="0" y="724" width="360" height="56" fill="#12161C"/>
  <path d="M48 750 l8 -8 l6 5 l10 -12" fill="none" stroke="#6FB2FF" stroke-width="1.6"/>
  <text class="nav" x="60" y="770" text-anchor="middle" fill="#6FB2FF">Tendance</text>
  <path d="M186 742 a9 9 0 1 0 -8 14 a11 11 0 0 1 8 -14 z" fill="none" stroke="#7C8695" stroke-width="1.5"/>
  <text class="nav" x="180" y="770" text-anchor="middle">Nuits</text>
  <path d="M288 743 h14 M288 750 h14 M288 757 h14" stroke="#7C8695" stroke-width="1.5"/>
  <circle cx="293" cy="743" r="2.4" fill="#12161C" stroke="#7C8695" stroke-width="1.3"/>
  <circle cx="299" cy="750" r="2.4" fill="#12161C" stroke="#7C8695" stroke-width="1.3"/>
  <circle cx="295" cy="757" r="2.4" fill="#12161C" stroke="#7C8695" stroke-width="1.3"/>
  <text class="nav" x="300" y="770" text-anchor="middle">Réglages</text>
</svg>
