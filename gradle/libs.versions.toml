[versions]
agp = "8.10.1"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
fragment = "1.8.5"
composeBom = "2024.12.01"
wear = "1.3.0"
wearCompose = "1.4.1"
playServicesWearable = "19.0.0"
work = "2.10.0"
datastore = "1.1.1"
healthConnect = "1.1.0"
room = "2.6.1"
ksp = "2.0.21-1.0.28"
navigationCompose = "2.8.5"
junit5 = "5.11.4"
androidxTestExt = "1.2.1"
androidxTestRunner = "1.6.2"
assertj = "3.27.0"

[libraries]
# --- commun Android
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# `collectAsStateWithLifecycle` : c'est lui qui garantit que la collecte s'arrete quand l'ecran
# s'eteint. Le module `:wear` le declarait en dur dans son `build.gradle.kts` ; il est remonte ici
# le jour ou `:phone` en a eu besoin a son tour, pour que les deux suivent la meme version.
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
# Contrainte explicite : `lintVital` (release uniquement) refuse `registerForActivityResult` si une
# version de Fragment anterieure a 1.3.0 est resolue transitivement. Les anciennes n'appelaient pas
# `super.onRequestPermissionsResult()` et utilisaient des codes de requete invalides, donc le
# resultat de permission n'arrivait jamais — ce qui, ici, aurait exactement l'effet du defaut que le
# lanceur Health Connect vient de corriger.
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# --- Compose (BOM)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# --- Wear OS
androidx-wear = { module = "androidx.wear:wear", version.ref = "wear" }
wear-compose-material = { module = "androidx.wear.compose:compose-material", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }

# --- Phone
health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# --- Tests JVM
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.4" }

# --- Tests instrumentes (sur appareil)
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
